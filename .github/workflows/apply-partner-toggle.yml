name: Apply Nexxus partner toggle
on:
  push:
    branches: [main]

jobs:
  patch:
    if: github.event.head_commit.message == 'Add styling for premium B2B partner experience'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch How It Works
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.js')
          text=p.read_text()
          imp="import PartnerHow from './PartnerHow';\n"
          if imp not in text:
              text=text.replace("import { reviewData } from './reviewData';\n", "import { reviewData } from './reviewData';\n"+imp)
          start=text.index('function How({go}){')
          end=text.index('function Reviews', start)
          block=text[start:end]
          block=block.replace("function How({go}){\n const [active,setActive]=useState(0);", "function How({go}){\n const [active,setActive]=useState(0);\n const [howMode,setHowMode]=useState('consumer');", 1)
          block=block.replace('return <section className="how-premium">', '''return <div className="how-mode-wrap"><div className="how-mode-switch"><div><span className="how-mode-eyebrow">HOW NEXXUS WORKS</span><strong>Choose your experience</strong></div><div className="how-mode-pills"><button className={howMode==='consumer'?'active':''} onClick={()=>setHowMode('consumer')}>For You</button><button className={howMode==='partner'?'active':''} onClick={()=>setHowMode('partner')}>For Partners</button></div></div>{howMode==='partner'?<PartnerHow go={go}/>:<section className="how-premium">''', 1)
          block=block.replace('\n </section>\n}\n', '\n </section>}</div>\n}\n', 1)
          text=text[:start]+block+text[end:]
          p.write_text(text)
          PY
      - name: Add toggle styling
        run: |
          cat >> app/globals.css <<'CSS'
          .how-mode-wrap{background:#fbf9f5;min-height:100%}.how-mode-switch{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:18px 5vw;border-bottom:1px solid #ded6ca;background:rgba(251,249,245,.96);position:sticky;top:0;z-index:20;backdrop-filter:blur(12px)}.how-mode-eyebrow{display:block;font-size:8px;letter-spacing:.18em;color:#bd9453;font-weight:700;margin-bottom:5px}.how-mode-switch strong{font-size:13px;font-weight:600}.how-mode-pills{display:flex;padding:4px;background:#ece6dd;border-radius:999px;gap:3px}.how-mode-pills button{border:0;background:transparent;border-radius:999px;padding:9px 18px;font-size:10px;font-weight:700;cursor:pointer;color:#6e675e}.how-mode-pills button.active{background:#171615;color:#fff;box-shadow:0 5px 15px rgba(0,0,0,.12)}@media(max-width:600px){.how-mode-switch{padding:14px 18px;align-items:flex-start}.how-mode-switch strong{font-size:11px}.how-mode-pills button{padding:8px 12px}}
          CSS
      - name: Commit patch
        run: |
          git config user.name 'Nexxus Bot'
          git config user.email 'nexxus-bot@users.noreply.github.com'
          git add app/page.js app/globals.css
          git commit -m 'Add B2B partner toggle to How It Works'
          git push
